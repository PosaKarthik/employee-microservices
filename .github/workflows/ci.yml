
name: Java Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  employee-service:
    name: Build Employee Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Employee Service
        run: mvn -B verify
        working-directory: employee-service

  department-service:
    name: Build Department Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Department Service
        run: mvn -B verify
        working-directory: department-service
        
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [employee-service, department-service]

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Employee Service image
        uses: docker/build-push-action@v6
        with:
           context: ./employee-service
           push: false
           tags: employee-service:latest

      - name: Build Department Service image
        uses: docker/build-push-action@v6
        with:
          context: ./department-service
          push: false
          tags: department-service:latest
