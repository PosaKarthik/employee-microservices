
name: Java Microservices CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: 
 contents: read
 packages: write

jobs:
  employee-service:
    name: Build Employee Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Employee Service
        run: mvn -B verify
        working-directory: employee-service
        
      - name: Upload Employee Service JAR
        uses: actions/upload-artifact@v4
        with:
           name: employee-service-jar
           path: employee-service/target/employee-service-0.0.1-SNAPSHOT.jar
           if-no-files-found: error
            
  department-service:
    name: Build Department Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Department Service
        run: mvn -B verify
        working-directory: department-service

      - name: Upload Department Service JAR
        uses: actions/upload-artifact@v4
        with:
           name: department-service-jar
           path: department-service/target/department-service-0.0.1-SNAPSHOT.jar
           if-no-files-found: error

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [employee-service, department-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Employee Service JAR
        uses: actions/download-artifact@v4
        with:
          name: employee-service-jar
          path: employee-service/target

      - name: Download Department Service JAR
        uses: actions/download-artifact@v4
        with:
          name: department-service-jar
          path: department-service/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GutHub Container Registry
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Employee Service image
        uses: docker/build-push-action@v6
        with:
          context: ./employee-service
          push: true
          tags: ghcr.io/posakarthik/employee-service:${{ github.sha }}

      - name: Build and Push Department Service image
        uses: docker/build-push-action@v6
        with:
          context: ./department-service
          push: true
          tags: ghcr.io/posakarthik/department-service:${{ github.sha }}
